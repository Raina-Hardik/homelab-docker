# Seed config for Seanime. `just init` copies this to seanime.config.toml if missing.
# The live seanime.config.toml is gitignored: Seanime rewrites it (e.g. `version`) on upgrades.
# The password below is only a startup seed; change it in the live file or in Seanime.

version = '3.10.4'

[cache]
dir = '$SEANIME_DATA_DIR/cache'
transcodedir = '$SEANIME_DATA_DIR/cache/transcode'

[database]
name = 'seanime'

[extensions]
dir = '$SEANIME_DATA_DIR/extensions'

[logs]
dir = '$SEANIME_DATA_DIR/logs'

[manga]
downloaddir = '$SEANIME_DATA_DIR/manga'
localdir = '$SEANIME_DATA_DIR/manga-local'

[offline]
assetdir = '$SEANIME_DATA_DIR/offline/assets'
dir = '$SEANIME_DATA_DIR/offline'

[server]
host = '0.0.0.0'
offline = false
password = "change-me"
port = 43211
trustedproxies = ['172.18.0.0/16']
usebinarypath = true

[torrent]
dir = '$SEANIME_DATA_DIR/torrent'

[web]
assetdir = '$SEANIME_DATA_DIR/assets'
